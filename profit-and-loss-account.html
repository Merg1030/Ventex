<html lang="en">

        :root {
            --bg: #f4f6fb;
            --bg2: #ffffff;
            --bg3: #f1f3f5;
            --border: #e2e6ef;
            --border2: #cdd3e0;
            --text: #1a1e2e;
            --text-fade: #6b7490;
            --text-dim: #a0a8c0;
            --blue: #4361ee;
            --cyan: #00b4d8;
            --green: #10b981;
            --orange: #f59e0b;
            --purple: #7c3aed;
            --danger: #ef4444;
            --radius: 10px;
            --radius-lg: 14px;
            --shadow: 0 2px 12px rgba(67,97,238,0.08);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            background: var(--bg2);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-mark {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--blue), var(--cyan));
            border-radius: 10px; color: white; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
        }
        .header h1 { font-size: 1.4rem; font-weight: 800; }
        .header h1 span { color: var(--blue); }
        .header .sub { font-size: 0.78rem; color: var(--text-fade); font-weight: 500; }

        .header-actions {
            display: flex;
            gap: 8px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--blue), var(--cyan));
            color: white;
            box-shadow: 0 2px 8px rgba(67,97,238,0.2);
        }
        .btn-primary:hover { transform: translateY(-1px); }
        .btn-secondary {
            background: var(--bg3);
            border: 1px solid var(--border2);
            color: var(--text-fade);
        }
        .btn-secondary:hover { border-color: var(--blue); color: var(--blue); background: white; }

        /* FILTERS */
        .filters {
            background: var(--bg2);
            border-radius: var(--radius-lg);
            padding: 14px 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: 4px;
            background: var(--bg3);
            border: 1.5px solid var(--border2);
            border-radius: 8px;
            padding: 3px;
        }
        .filter-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: var(--text-fade);
            transition: all 0.15s;
            font-family: 'DM Sans', sans-serif;
        }
        .filter-btn.active {
            background: var(--blue);
            color: white;
            box-shadow: 0 1px 3px rgba(67,97,238,0.3);
        }
        .filter-btn:hover:not(.active) { background: rgba(67,97,238,0.08); }

        .date-input {
            background: var(--bg3);
            border: 1.5px solid var(--border2);
            border-radius: 8px;
            padding: 6px 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--text);
            outline: none;
            cursor: pointer;
        }
        .date-input:focus { border-color: var(--blue); }

        .quarter-select {
            background: var(--bg3);
            border: 1.5px solid var(--border2);
            border-radius: 8px;
            padding: 6px 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--text);
            outline: none;
            cursor: pointer;
        }
        .quarter-select:focus { border-color: var(--blue); }

        .filter-hide { display: none; }

        .search-input {
            flex: 1;
            min-width: 160px;
            padding: 6px 12px 6px 32px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.76rem;
            background: var(--bg3);
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: all 0.15s;
        }
        .search-input:focus { border-color: var(--blue); background: white; box-shadow: 0 0 0 3px rgba(67,97,238,0.1); }
        .search-wrap { position: relative; flex: 1; min-width: 160px; }
        .search-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 0.72rem; }

        .branch-select {
            background: var(--bg3);
            border: 1.5px solid var(--border2);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.76rem;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            outline: none;
            cursor: pointer;
        }
        .branch-select:focus { border-color: var(--blue); }

        /* KPI ROW */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        .kpi-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            box-shadow: var(--shadow);
        }
        .kpi-card .kpi-label {
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--text-fade);
            text-transform: uppercase;
            letter-spacing: 0.09em;
            margin-bottom: 4px;
        }
        .kpi-card .kpi-value {
            font-size: 1.2rem;
            font-weight: 800;
            font-family: 'DM Mono', monospace;
        }
        .kpi-card.k1 { border-left: 3px solid var(--blue); }
        .kpi-card.k1 .kpi-value { color: var(--blue); }
        .kpi-card.k2 { border-left: 3px solid var(--green); }
        .kpi-card.k2 .kpi-value { color: var(--green); }
        .kpi-card.k3 { border-left: 3px solid var(--orange); }
        .kpi-card.k3 .kpi-value { color: var(--orange); }
        .kpi-card.k4 { border-left: 3px solid var(--purple); }
        .kpi-card.k4 .kpi-value { color: var(--purple); }

        /* P&L TABLE */
        .pl-container {
            background: var(--bg2);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .pl-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .pl-table tr { border-bottom: 1px solid #f0f3f9; }
        .pl-table tr:last-child { border-bottom: none; }
        .pl-table td {
            padding: 10px 18px;
            vertical-align: middle;
        }
        .col-label { width: 55%; font-weight: 500; color: var(--text); }
        .col-amount { width: 20%; text-align: right; font-weight: 500; color: var(--text); font-family: 'DM Mono', monospace; }
        .col-sub { width: 25%; text-align: right; font-weight: 600; color: var(--text); font-family: 'DM Mono', monospace; }

        .indent-1 { padding-left: 36px !important; font-weight: 400; color: var(--text-fade); }
        .indent-2 { padding-left: 56px !important; font-weight: 400; color: var(--text-fade); font-size: 0.85rem; }

        .row-subtotal td {
            padding-top: 12px;
            padding-bottom: 12px;
            border-top: 2px solid #dce3ed;
            font-weight: 600;
        }
        .row-subtotal .col-label { font-weight: 700; color: var(--text); }

        .row-total td {
            padding-top: 14px;
            padding-bottom: 14px;
            border-top: 2px solid var(--blue);
            font-weight: 700;
            font-size: 1.05rem;
        }
        .row-total .col-label { font-weight: 800; color: var(--text); }
        .row-total .col-amount, .row-total .col-sub { font-weight: 800; }

        .row-spacer td { padding: 4px 0; border-bottom: none; }

        .profit-positive { color: var(--green); }
        .profit-negative { color: var(--danger); }

        .pl-header-row td {
            padding-top: 16px;
            padding-bottom: 10px;
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--text);
            border-bottom: 2px solid var(--border);
        }
        .pl-header-row .col-label { font-size: 0.95rem; }

        .tax-note {
            font-size: 0.7rem;
            color: var(--text-fade);
            padding: 10px 18px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            background: var(--bg3);
            flex-wrap: wrap;
            gap: 8px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .kpi-row { grid-template-columns: 1fr 1fr; }
            .filters { flex-direction: column; align-items: stretch; }
            .filter-group { align-self: flex-start; }
            .search-wrap { min-width: 100%; }
            .pl-table td { padding: 8px 12px; font-size: 0.8rem; }
            .indent-1 { padding-left: 20px !important; }
            .indent-2 { padding-left: 36px !important; }
            .header { flex-direction: column; align-items: stretch; }
            .header-actions { align-self: flex-start; }
        }
        @media (max-width: 480px) {
            .kpi-row { grid-template-columns: 1fr; }
            .col-label { width: 45%; font-size: 0.75rem; }
            .col-amount, .col-sub { font-size: 0.7rem; }
        }
    </style>
</head>

        <button class="btn btn-primary" onclick="applyFilters()"><i class="fas fa-filter"></i> Filter</button>

        {date:"2026-08-17", branch:"makeni", code:"EL-2", product:"Iphone cable - iron stone", price:25.00, qty:1, discount:0.00, cost:6.93},

    // Ledger expenses (August 2026)
    const ledgerExpenses = [
        {date:"2026-08-04", description:"transaction fees", amount:50.00},
        {date:"2026-08-04", description:"shop alarm system", amount:197.00},
        {date:"2026-08-04", description:"inventory reorder", amount:1472.00},

        {date:"2026-08-06", description:"inventory reorder", amount:485.00},
        {date:"2026-08-10", description:"inventory reorder", amount:110.00},
        {date:"2026-08-11", description:"rentals", amount:613.00},

        {date:"2026-08-12", description:"paccra name clearance", amount:114.00},
        {date:"2026-08-18", description:"Trismart - business name paccra", amount:230.00}
    ];

    const TAX_RATE = 0.04; // 4%

    // ─── STATE ────────────────────────────────────────────────

    let currentFilter = 'monthly';
    let displayedData = [];

    function fmt(n) {
        return 'K ' + Math.abs(Number(n)).toFixed(2);
    }

    function getDateRange(filterType) {
        let startDate, endDate;

        if (filterType === 'monthly') {
            const month = document.getElementById('monthFilter').value;
            if (!month) return null;
            startDate = month + '-01';
            const end = new Date(month + '-01');
            end.setMonth(end.getMonth() + 1);
            end.setDate(end.getDate() - 1);
            endDate = end.toISOString().split('T')[0];
        } else if (filterType === 'quarterly') {
            const quarter = document.getElementById('quarterFilter').value;
            if (!quarter) return null;
            const [year, q] = quarter.split('-Q');
            const qStart = { '1': '01', '2': '04', '3': '07', '4': '10' }[q];
            const qEnd = { '1': '03-31', '2': '06-30', '3': '09-30', '4': '12-31' }[q];
            startDate = year + '-' + qStart + '-01';
            endDate = year + '-' + qEnd;
        } else if (filterType === 'yearly') {
            const year = document.getElementById('yearFilter').value;
            if (!year) return null;
            startDate = year + '-01-01';
            endDate = year + '-12-31';
        }

        return { start: startDate, end: endDate };
    }

    // ─── FILTER FUNCTIONS ─────────────────────────────────────

    window.setFilter = function(type) {
        currentFilter = type;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === type));

        document.getElementById('monthlyPicker').style.display = type === 'monthly' ? 'inline-block' : 'none';
        document.getElementById('quarterlyPicker').style.display = type === 'quarterly' ? 'inline-block' : 'none';
        document.getElementById('yearlyPicker').style.display = type === 'yearly' ? 'inline-block' : 'none';

        applyFilters();
    };

    window.applyFilters = function() {
        const range = getDateRange(currentFilter);
        if (!range) return;

        // Filter sales by date range
        let filtered = salesData
            .filter(s => s.date >= range.start && s.date <= range.end)
            .map(s => ({
                ...s,
                netSales: (s.price * s.qty) - s.discount,
                totalCost: s.cost * s.qty,
                profit: ((s.price * s.qty) - s.discount) - (s.cost * s.qty)
            }));

        // Branch filter
        const branch = document.getElementById('branchSelect').value;
        if (branch) {
            filtered = filtered.filter(r => r.branch === branch);
        }

        // Search filter
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        if (search) {
            filtered = filtered.filter(r =>
                r.product.toLowerCase().includes(search) ||
                r.code.toLowerCase().includes(search) ||
                r.branch.toLowerCase().includes(search)
            );
        }

        displayedData = filtered;
        renderPL(filtered, range);
        updateKPIs(filtered);
        updatePeriodDisplay(range);
    };

    window.resetFilters = function() {
        document.getElementById('branchSelect').value = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('monthFilter').value = '2026-08';
        document.getElementById('quarterFilter').value = '2026-Q3';
        document.getElementById('yearFilter').value = '2026';
        applyFilters();
    };

    // ─── RENDER P&L ──────────────────────────────────────────

    function renderPL(data, range) {
        const tbody = document.getElementById('plBody');

        // Calculate totals
        let totalSales = 0, totalCOGS = 0, totalDiscount = 0, totalQty = 0;
        data.forEach(d => {
            totalSales += d.netSales;
            totalCOGS += d.totalCost;
            totalDiscount += d.discount;
            totalQty += d.qty;
        });

        const grossProfit = totalSales - totalCOGS;

        // Filter expenses by same date range
        let expenseFiltered = ledgerExpenses.filter(e => e.date >= range.start && e.date <= range.end);

        // Group expenses by description
        const expMap = {};
        expenseFiltered.forEach(e => {
            if (!expMap[e.description]) expMap[e.description] = 0;
            expMap[e.description] += e.amount;
        });

        let totalExpenses = expenseFiltered.reduce((sum, e) => sum + e.amount, 0);

        const operatingIncome = grossProfit - totalExpenses;
        const taxAmount = operatingIncome > 0 ? operatingIncome * TAX_RATE : 0;
        const netProfit = operatingIncome - taxAmount;

        // Build table rows
        let html = '';

        // REVENUE
        html += `<tr class="pl-header-row"><td class="col-label"><strong>Revenue</strong></td><td class="col-amount"></td><td class="col-sub"></td></tr>`;
        html += `<tr><td class="col-label indent-1">Electronics sales</td><td class="col-amount">${fmt(totalSales)}</td><td class="col-sub"></td></tr>`;
        html += `<tr class="row-subtotal"><td class="col-label">Total Revenue</td><td class="col-amount"></td><td class="col-sub">${fmt(totalSales)}</td></tr>`;
        html += `<tr class="row-spacer"><td colspan="3"></td></tr>`;

        // COGS
        html += `<tr class="pl-header-row"><td class="col-label"><strong>Cost of Goods Sold</strong></td><td class="col-amount"></td><td class="col-sub"></td></tr>`;
        html += `<tr><td class="col-label indent-1">Inventory cost</td><td class="col-amount">${fmt(totalCOGS)}</td><td class="col-sub"></td></tr>`;
        html += `<tr class="row-subtotal"><td class="col-label">Total COGS</td><td class="col-amount"></td><td class="col-sub">${fmt(totalCOGS)}</td></tr>`;
        html += `<tr class="row-spacer"><td colspan="3"></td></tr>`;

        // GROSS PROFIT
        html += `<tr class="row-subtotal" style="border-top:2px solid #b3c4db;"><td class="col-label"><strong>Gross Profit</strong></td><td class="col-amount"></td><td class="col-sub ${grossProfit >= 0 ? 'profit-positive' : 'profit-negative'}">${fmt(grossProfit)}</td></tr>`;
        html += `<tr class="row-spacer"><td colspan="3"></td></tr>`;

        // OPERATING EXPENSES
        html += `<tr class="pl-header-row"><td class="col-label"><strong>Operating Expenses</strong></td><td class="col-amount"></td><td class="col-sub"></td></tr>`;

        if (Object.keys(expMap).length > 0) {
            Object.entries(expMap).forEach(([desc, amount]) => {
                html += `<tr><td class="col-label indent-1">${desc}</td><td class="col-amount">${fmt(amount)}</td><td class="col-sub"></td></tr>`;
            });
        } else {
            html += `<tr><td class="col-label indent-1" style="color:var(--text-fade);">No expenses recorded</td><td class="col-amount">—</td><td class="col-sub"></td></tr>`;
        }

        html += `<tr class="row-subtotal"><td class="col-label">Total Operating Expenses</td><td class="col-amount"></td><td class="col-sub">${fmt(totalExpenses)}</td></tr>`;
        html += `<tr class="row-spacer"><td colspan="3"></td></tr>`;

        // OPERATING INCOME
        html += `<tr class="row-subtotal" style="border-top:2px solid #b3c4db;"><td class="col-label"><strong>Operating Income (EBIT)</strong></td><td class="col-amount"></td><td class="col-sub ${operatingIncome >= 0 ? 'profit-positive' : 'profit-negative'}">${fmt(operatingIncome)}</td></tr>`;
        html += `<tr class="row-spacer"><td colspan="3"></td></tr>`;

        // TAX
        html += `<tr class="pl-header-row"><td class="col-label"><strong>Tax</strong></td><td class="col-amount"></td><td class="col-sub"></td></tr>`;
        html += `<tr><td class="col-label indent-1">Income tax (4%)</td><td class="col-amount">${fmt(taxAmount)}</td><td class="col-sub"></td></tr>`;
        html += `<tr class="row-spacer"><td colspan="3"></td></tr>`;

        // NET PROFIT
        html += `<tr class="row-total"><td class="col-label"><strong>Net Profit / (Loss)</strong></td><td class="col-amount"></td><td class="col-sub ${netProfit >= 0 ? 'profit-positive' : 'profit-negative'}">${fmt(netProfit)}</td></tr>`;

        // Extra: Quantity and Discount info
        html += `<tr class="row-spacer"><td colspan="3"></td></tr>`;
        html += `<tr><td class="col-label indent-1" style="font-size:0.78rem;color:var(--text-fade);">Items sold: <strong>${totalQty}</strong></td><td class="col-amount" style="font-size:0.78rem;color:var(--text-fade);">Discounts: ${fmt(totalDiscount)}</td><td class="col-sub"></td></tr>`;

        tbody.innerHTML = html;
    }

    function updateKPIs(data) {
        let qty = 0, netSales = 0, totalCost = 0;
        data.forEach(d => {
            qty += d.qty;
            netSales += d.netSales;
            totalCost += d.totalCost;
        });

        const grossProfit = netSales - totalCost;

        // Get range for expenses
        const range = getDateRange(currentFilter);
        let totalExpenses = 0;
        if (range) {
            totalExpenses = ledgerExpenses
                .filter(e => e.date >= range.start && e.date <= range.end)
                .reduce((sum, e) => sum + e.amount, 0);
        }

        const operatingIncome = grossProfit - totalExpenses;
        const taxAmount = operatingIncome > 0 ? operatingIncome * TAX_RATE : 0;
        const netProfit = operatingIncome - taxAmount;

        document.getElementById('kpiSales').textContent = fmt(netSales);
        document.getElementById('kpiProfit').textContent = fmt(grossProfit);
        document.getElementById('kpiQty').textContent = qty;
        document.getElementById('kpiNet').textContent = fmt(netProfit);

        const netEl = document.getElementById('kpiNet');
        netEl.style.color = netProfit >= 0 ? 'var(--green)' : 'var(--danger)';
    }

    function updatePeriodDisplay(range) {
        let label = '';
        if (currentFilter === 'monthly') {
            const month = document.getElementById('monthFilter').value;
            if (month) label = new Date(month + '-01').toLocaleString('en-GB', { month:'long', year:'numeric' });
        } else if (currentFilter === 'quarterly') {
            const quarter = document.getElementById('quarterFilter').value;
            if (quarter) label = quarter.replace('-Q', ' Q');
        } else if (currentFilter === 'yearly') {
            const year = document.getElementById('yearFilter').value;
            if (year) label = 'Year ' + year;
        }
        document.getElementById('periodDisplay').textContent = 'Period: ' + (label || 'All time') + 
            ' (' + range.start + ' to ' + range.end + ')';
    }

    // ─── EXPORT ──────────────────────────────────────────────

    window.exportReport = function() {
        const win = window.open('', '_blank', 'width=1000,height=800');
        const content = document.getElementById('plBody').innerHTML;
        const kpiSales = document.getElementById('kpiSales').textContent;
        const kpiProfit = document.getElementById('kpiProfit').textContent;
        const kpiQty = document.getElementById('kpiQty').textContent;
        const kpiNet = document.getElementById('kpiNet').textContent;

        win.document.write(`
            <html><head><title>Trismart P&L Report</title>
            <style>
                body { font-family: 'DM Sans', sans-serif; padding: 30px; color: #1a1e2e; }
                h1 { font-size: 1.4rem; }
                .sub { color: #6b7490; margin-bottom: 20px; }
                .grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
                .card { border: 1px solid #e2e6ef; padding: 12px; border-radius: 8px; }
                .card .lbl { font-size: 0.65rem; text-transform: uppercase; color: #6b7490; font-weight: 700; }
                .card .val { font-size: 1.1rem; font-weight: 800; }
                table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
                td { padding: 8px 12px; border-bottom: 1px solid #f0f2f8; }
                .row-subtotal td { border-top: 2px solid #dce3ed; font-weight: 600; padding-top: 12px; }
                .row-total td { border-top: 2px solid #4361ee; font-weight: 800; font-size: 1rem; padding-top: 14px; }
                .indent-1 { padding-left: 30px; }
                .profit-positive { color: #10b981; }
                .profit-negative { color: #ef4444; }
                .footer { margin-top: 20px; color: #6b7490; font-size: 0.7rem; border-top: 1px solid #e2e6ef; padding-top: 12px; }
            </style>
            </head><body>
            <h1>Tri<span style="color:#4361ee;">smart</span> · Profit & Loss Report</h1>
            <div class="sub">Generated: ${new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}</div>
            <div class="grid">
                <div class="card"><div class="lbl">Total Sales</div><div class="val">${kpiSales}</div></div>
                <div class="card"><div class="lbl">Gross Profit</div><div class="val">${kpiProfit}</div></div>
                <div class="card"><div class="lbl">Qty Sold</div><div class="val">${kpiQty}</div></div>
                <div class="card"><div class="lbl">Net Profit</div><div class="val">${kpiNet}</div></div>
            </div>
            <table>
                <tbody>${content}</tbody>
            </table>
            <div class="footer">Trismart Profit & Loss · All amounts in K (ZMW) · Tax rate: 4%</div>
            </body></html>
        `);
        win.document.close();
        setTimeout(() => win.print(), 500);
    };

    // ─── INIT ─────────────────────────────────────────────────

    // Set defaults
    document.getElementById('monthFilter').value = '2026-08';
    document.getElementById('quarterFilter').value = '2026-Q3';
    document.getElementById('yearFilter').value = '2026';

    // Event listeners
    document.getElementById('monthFilter').addEventListener('change', applyFilters);
    document.getElementById('quarterFilter').addEventListener('change', applyFilters);
    document.getElementById('yearFilter').addEventListener('change', applyFilters);
    document.getElementById('branchSelect').addEventListener('change', applyFilters);
    document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilters(); });

    // Initial load
    applyFilters();
</script>
